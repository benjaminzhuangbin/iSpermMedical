plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 30

    defaultConfig {
        applicationId "com.nexus.adbwatchdog"
        minSdkVersion 22
        targetSdkVersion 22
        versionCode 24
        versionName "2.4.0"
        // Keep package stable for Main APP Intent integration
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        abortOnError false
    }
}

dependencies {
    // Minimal deps for Arctic Fox + API 22. No modern Compose/Kotlin.
    implementation 'androidx.appcompat:appcompat:1.3.1'
}
