# Nexus ADB Watchdog 2.3 — production defaults
interval=5
log_rotate_mb=10
status_update=1

recovery_enable=1
max_restart=3
restart_window_sec=600
cooldown_sec=60
adbd_sleep_sec=3

# Log on change/recovery; heartbeat every N seconds
log_heartbeat_sec=300

# Android-side TCP_FAULT heuristic (NOT ESTABLISHED=0)
# CLOSE_WAIT >= fault_close_wait for fault_hold_sec => Case C recovery
fault_close_wait=3
fault_hold_sec=30

# Layer 4: localhost ADB CNXN protocol health (Android-side)
adb_proto_check=1
adb_proto_interval_sec=30
adb_proto_timeout_ms=2000
